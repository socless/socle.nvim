name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NVIM_VERSION: v0.12.6

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim ${{ env.NVIM_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nvim.tar.gz" \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Run the specs
        run: |
          nvim --version | head -1
          nvim --headless -u NONE -l tests/run.lua

  # Runs the real server on Socle's example project. Manual only: both
  # repositories are private, so it needs the SOCLE_TOKEN secret (read access
  # to e-ban/socle, see the README's Development section).
  integration:
    name: Integration test (real server)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim ${{ env.NVIM_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nvim.tar.gz" \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      # One source for the pin: lua/socle/versions.lua.
      - name: Read the pinned server version
        run: |
          pin=$(nvim --headless -u NONE --cmd 'set rtp+=.' -l - <<<'io.write(require("socle.versions").PINNED)')
          test -n "$pin"
          echo "SOCLE_VERSION=$pin" >> "$GITHUB_ENV"

      - name: Check out Socle v${{ env.SOCLE_VERSION }}
        uses: actions/checkout@v7
        with:
          repository: e-ban/socle
          ref: v${{ env.SOCLE_VERSION }}
          path: socle
          token: ${{ secrets.SOCLE_TOKEN }}
          persist-credentials: false

      # The server is `java -jar` and needs Java 21. Verilator is not needed:
      # View design does not simulate.
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Mill / Coursier
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
            ~/.mill
          key: mill-${{ runner.os }}-socle-${{ hashFiles('socle/build.mill') }}
          restore-keys: |
            mill-${{ runner.os }}-socle-

      - name: Download the server jar
        env:
          GH_TOKEN: ${{ secrets.SOCLE_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/jar"
          gh release download "v$SOCLE_VERSION" --repo e-ban/socle \
            --pattern "socle-lsp-$SOCLE_VERSION.jar" --pattern SHA256SUMS --dir "$RUNNER_TEMP/jar"
          (cd "$RUNNER_TEMP/jar" && sha256sum -c --ignore-missing SHA256SUMS)
          echo "SOCLE_JAR=$RUNNER_TEMP/jar/socle-lsp-$SOCLE_VERSION.jar" >> "$GITHUB_ENV"
          echo "SOCLE_ROOT=$GITHUB_WORKSPACE/socle" >> "$GITHUB_ENV"

      # The server bounds each Mill call (10 min): compile the example first,
      # so the spec's view only asks Mill for the classpath, as it does locally.
      - name: Compile the example
        working-directory: socle
        run: ./mill --ticker false example.test.compile

      # The runner skips tests/integration without SOCLE_ROOT and SOCLE_JAR;
      # here both are set, so a missing spec must fail instead of passing empty.
      - name: Run the integration specs
        run: |
          test -f tests/integration/view_spec.lua
          nvim --headless -u NONE -l tests/run.lua integration
